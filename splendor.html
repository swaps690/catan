<!doctype html>
<html><head><meta charset="utf-8"><title>Splendor</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",system-ui,sans-serif;color:#eee;height:100vh;display:grid;grid-template-columns:minmax(0,1fr) 330px;grid-template-rows:minmax(0,1fr) 132px;background:radial-gradient(ellipse at 50% 30%,#26506b,#12293c 70%,#0c1c2a)}
#board{grid-column:1;grid-row:1;min-width:0;min-height:0;overflow:auto;padding:10px 12px;display:flex;flex-direction:column;gap:8px;align-items:center}
#side{grid-column:2;grid-row:1/3;background:linear-gradient(#1b3247,#142636);padding:8px;display:flex;flex-direction:column;gap:8px;min-height:0;font-size:14px;box-shadow:-3px 0 10px rgba(0,0,0,.4)}
#log{flex:1;min-height:0;overflow-y:auto;background:rgba(0,0,0,.25);border-radius:10px;padding:6px 8px;font-size:13px}
#log div{padding:3px 2px;border-bottom:1px solid rgba(255,255,255,.07)}
#log div:first-child{animation:fadein .5s}
@keyframes fadein{from{background:rgba(246,201,58,.35)}to{background:transparent}}
#bottom{grid-column:1;grid-row:2;min-width:0;background:linear-gradient(#16304a,#0f2233);border-top:2px solid #2b526e;display:flex;align-items:center;gap:12px;padding:8px 12px;box-shadow:0 -3px 10px rgba(0,0,0,.35)}
/* cards */
.dc{--c:#888;flex:none;width:92px;height:126px;border-radius:9px;position:relative;padding:5px;cursor:default;
  background:linear-gradient(160deg,#fdfbf3,#ded6c0);box-shadow:0 3px 6px rgba(0,0,0,.5);color:#222;overflow:hidden}
.dc:before{content:"";position:absolute;inset:0 0 auto 0;height:38px;background:linear-gradient(var(--c),color-mix(in srgb,var(--c) 70%,#000))}
.dc .pts{position:absolute;top:2px;left:7px;font-size:22px;font-weight:800;color:#fff;text-shadow:0 2px 3px rgba(0,0,0,.6);z-index:2}
.dc .bg{position:absolute;top:8px;right:7px;width:22px;height:22px;box-sizing:border-box;border-radius:50%;background:var(--c);border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.6);z-index:2}
.dc .cost{position:absolute;left:6px;bottom:6px;display:flex;flex-direction:column-reverse;gap:3px}
.cc{width:21px;height:21px;border-radius:50%;background:var(--c);border:1.5px solid rgba(255,255,255,.85);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;text-shadow:0 1px 2px rgba(0,0,0,.7)}
.cc.w{color:#333;text-shadow:none;border-color:#7a7365;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.dc.pick{outline:3px solid #f6c93a;outline-offset:2px}
.dc.buyable{cursor:pointer;box-shadow:0 0 0 2px #6ee07a,0 3px 8px rgba(0,0,0,.5)}
.dc.sel{cursor:pointer}
.dc.back{background:repeating-linear-gradient(45deg,#2b3a72 0 8px,#374a91 8px 16px);color:#fff}
.dc.back:before{display:none}
.deck{width:70px;height:126px;border-radius:9px;flex:none;background:repeating-linear-gradient(45deg,#2b3a72 0 8px,#374a91 8px 16px);border:2px solid #f6c93a44;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:700;box-shadow:0 3px 6px rgba(0,0,0,.5);cursor:default}
.deck.sel{cursor:pointer}
.deck small{opacity:.8;font-weight:400;font-size:11px}
.row{display:flex;gap:8px;align-items:center}
.slot{width:92px;height:126px;flex:none}
/* nobles */
#nobles{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.noble{width:74px;height:74px;border-radius:8px;background:linear-gradient(145deg,#efe7d2,#c9bb98);color:#2a2418;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;box-shadow:0 3px 6px rgba(0,0,0,.5);position:relative;border:2px solid #f6c93a}
.noble b{font-size:17px}
.noble .req{display:flex;gap:2px}
.noble .req span{width:17px;height:17px;border-radius:4px;font-size:10px;font-weight:700;color:#fff;display:flex;align-items:center;justify-content:center;text-shadow:0 1px 2px rgba(0,0,0,.6)}
/* tokens */
#bank{display:flex;gap:10px;margin-top:2px}
.pile{width:52px;height:52px;border-radius:50%;border:3px solid rgba(255,255,255,.65);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:19px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.7);box-shadow:0 3px 6px rgba(0,0,0,.5),inset 0 -3px 8px rgba(0,0,0,.35);position:relative}
.pile.w{color:#333;text-shadow:none;border-color:#b9b2a2}
.pile.on{cursor:pointer}
.pile.on:hover{transform:translateY(-3px)}
.pile.off{opacity:.35}
.pile .s{position:absolute;top:-6px;right:-6px;background:#f6c93a;color:#222;border-radius:9px;font-size:11px;padding:0 5px;border:1px solid #7a5f00}
.pill{width:40px;height:44px;border-radius:7px;border:2px solid rgba(255,255,255,.6);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;line-height:1;text-shadow:0 1px 2px rgba(0,0,0,.7);box-shadow:0 2px 4px rgba(0,0,0,.4)}
.pill.w{color:#222;text-shadow:none;border-color:#8d8779}
.pill b{font-size:16px}
.pill i{font-style:normal;font-size:10px;opacity:.9;border-top:1px solid rgba(255,255,255,.45);padding-top:1px;margin-top:1px}
/* players */
.pl{background:rgba(255,255,255,.07);border-radius:10px;padding:6px;display:flex;flex-direction:column;gap:4px;border-left:5px solid}
.pl.cur{background:rgba(246,201,58,.18);box-shadow:0 0 0 2px #f6c93a}
.pl .top{display:flex;align-items:center;gap:7px}
.av{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px;border:2px solid #fff;flex:none}
.pl .nm{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.pl .vp{background:#f6c93a;color:#222;font-weight:800;border-radius:8px;padding:1px 8px;font-size:14px}
.mini{display:flex;gap:3px}
.mini span{flex:1;border-radius:4px;font-size:11px;text-align:center;color:#fff;padding:1px 0;text-shadow:0 1px 2px rgba(0,0,0,.7);border:1px solid rgba(255,255,255,.35)}
.mini span.w{color:#222;text-shadow:none;border-color:#8d8779}
button{font-family:inherit}
.btn{background:linear-gradient(#f6c93a,#dba60f);color:#241c00;border:0;border-radius:8px;padding:9px 14px;font-weight:700;cursor:pointer;box-shadow:0 2px 4px rgba(0,0,0,.4)}
.btn:disabled{opacity:.35;cursor:default;box-shadow:none}
.btn.g{background:linear-gradient(#79e089,#31a949);color:#04220c}
.btn.b{background:linear-gradient(#8fb8e8,#4a7fc1);color:#04162b}
.btn.s{background:rgba(255,255,255,.14);color:#eee;padding:6px 10px;font-weight:600}
#turn{background:rgba(0,0,0,.3);border-radius:10px;padding:6px 12px;min-width:190px;text-align:center;flex:none}
#turn small{display:block;font-size:12px;opacity:.85}
.grp{display:flex;flex-direction:column;gap:4px;align-items:center;font-size:11px;opacity:.9}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:9}
#modal>div{background:#1b3247;padding:18px 22px;border-radius:12px;max-width:680px;box-shadow:0 8px 30px rgba(0,0,0,.6);color:#eee}
#modal h3{margin:0 0 10px}
#modal button{padding:6px 12px;margin:3px;border-radius:6px;border:1px solid #55708a;background:#25455f;color:#eee;cursor:pointer;font-size:14px}
#modal button:disabled{opacity:.4;cursor:default}
table.st{border-collapse:collapse;width:100%;font-size:13px}
table.st td,table.st th{padding:4px 8px;border-bottom:1px solid rgba(255,255,255,.12);text-align:center}
table.st tr.w{background:rgba(246,201,58,.2)}
#lobby{position:fixed;inset:0;background:linear-gradient(#153450,#0b1c2b);display:none;justify-content:center;padding:30px 20px;z-index:8;overflow:auto}
.panel{background:rgba(255,255,255,.08);border-radius:14px;padding:20px 24px;box-shadow:0 4px 20px rgba(0,0,0,.4)}
.panel h2{margin:0 0 14px;text-align:center}
.panel input[type=text]{font-size:15px;padding:6px 8px;border-radius:6px;border:none}
.slot2{background:rgba(255,255,255,.08);border-radius:8px;padding:8px 10px;margin:8px 0;display:flex;align-items:center;gap:10px;width:320px}
.slot2 .dot{width:20px;height:20px;border-radius:50%;border:2px solid #fff;flex:none}
.slot2 input{flex:1}
.fly{position:fixed;z-index:20;pointer-events:none;left:var(--x0);top:var(--y0);transform:translate(-50%,-50%);opacity:0;animation:fly .85s cubic-bezier(.35,.6,.3,1) both}
@keyframes fly{0%{left:var(--x0);top:var(--y0);transform:translate(-50%,-50%) scale(.6);opacity:0}15%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}85%{opacity:1}100%{left:var(--x1);top:var(--y1);transform:translate(-50%,-50%) scale(.7);opacity:0}}
.fly .chip{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.8);box-shadow:0 4px 10px rgba(0,0,0,.6)}
.fly .mc{width:40px;height:54px;border-radius:6px;border:2px solid rgba(255,255,255,.8);box-shadow:0 4px 10px rgba(0,0,0,.6)}
</style></head><body>
<div id="board"></div><div id="bottom"></div><div id="side"></div>
<div id="lobby"><div style="width:100%;max-width:900px">
  <div class="panel" id="lobbyHead"></div>
  <div style="display:flex;gap:24px;margin-top:20px;align-items:flex-start;flex-wrap:wrap">
    <div class="panel" id="lobbyPlayers"></div>
    <div class="panel" style="flex:1;min-width:320px"><h2>Game</h2>
      <div id="lobbyRules" style="text-align:center">
        <p>🏆 Points to win <input type="number" id="optTarget" value="15" min="3" max="30" style="width:60px;text-align:center;padding:4px"></p>
        <p style="font-size:13px;opacity:.85;max-width:420px;margin:0 auto">Standard Splendor: 90 development cards, 10 nobles, gold jokers.<br>2 players use 4 gems of each colour, 3 players 5, 4 players 7.</p>
      </div>
      <div id="lobbyStart" style="text-align:center;margin-top:18px"></div>
      <p style="text-align:center;font-size:13px;opacity:.7;margin-bottom:0">🎲 <a href="index.html" style="color:#f6c93a">Play Catan instead</a></p>
    </div>
  </div>
</div></div>
<div id="modal"><div id="mbody"></div></div>
<script>
// ponytail: single-file Splendor. Hotseat or online (WebRTC via PeerJS, host-authoritative).
const GEMS=['w','u','g','r','k'],ALL=[...GEMS,'y'];
const GC={w:'#efe9dc',u:'#2f7fd6',g:'#2f9e52',r:'#d94a3d',k:'#3b3b46',y:'#f6c93a'};
const GN={w:'Diamond',u:'Sapphire',g:'Emerald',r:'Ruby',k:'Onyx',y:'Gold'};
const PCOL=['#e63b2e','#2b7fd6','#f28c28','#3fae4d'],AVI=['🦊','🐻','🐸','🐼'];
const SUPPLY={2:4,3:5,4:7};
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
let G=null;

// ---------- deck ----------
// Real Splendor decks are one cost pattern set per tier, rotated across the 5 colours; built the same way here.
// ponytail: generated cyclically instead of hardcoding 90 cards — same counts, points and cost curve.
const T1=[[{1:1,2:1,3:1,4:1},0],[{1:1,2:2,3:1,4:1},0],[{1:2,2:2,4:1},0],[{1:1,2:3,3:1},0],[{3:3},0],[{1:2,3:1},0],[{2:2,4:2},0],[{2:4},1]];
const T2=[[{1:3,2:2,3:2},1],[{2:3,3:2,4:2},1],[{3:5},2],[{1:5,2:3},2],[{2:4,3:2,4:1},2],[{4:6},3]];
const T3=[[{1:3,2:3,3:5,4:3},3],[{2:7},4],[{1:3,2:6,3:3},4],[{2:7,3:3},5]];
const NOBLES=[{w:4,u:4},{u:4,g:4},{g:4,r:4},{r:4,k:4},{k:4,w:4},{w:3,u:3,g:3},{u:3,g:3,r:3},{g:3,r:3,k:3},{r:3,k:3,w:3},{k:3,w:3,u:3}];
let cardSeq=0;
function makeDeck(tier,tpl){
  return shuffle(GEMS.flatMap((gem,i)=>tpl.map(([off,pts])=>{
    const cost={};for(const o in off)cost[GEMS[(i+ +o)%5]]=off[o];
    return {id:++cardSeq,tier,gem,pts,cost};
  })));
}

// ---------- state ----------
function newGame(seats,opts={target:15}){
  const n=seats.length,s=SUPPLY[n]||7;
  G={id:Math.random().toString(36).slice(2),opts,cur:0,turns:0,round:0,winner:null,ending:false,prompt:null,log:[],fx:[],fxSeq:0,
    bank:{w:s,u:s,g:s,r:s,k:s,y:5},
    decks:[makeDeck(1,T1),makeDeck(2,T2),makeDeck(3,T3)],
    board:[[],[],[]],nobles:shuffle([...NOBLES]).slice(0,n+1),
    start:Date.now(),end:null,players:[]};
  G.decks.forEach((d,t)=>{for(let i=0;i<4;i++)G.board[t].push(d.pop()||null)});
  seats.forEach((x,i)=>G.players.push({i,name:x.name||x,color:x.color||PCOL[i],
    tok:{w:0,u:0,g:0,r:0,k:0,y:0},bonus:{w:0,u:0,g:0,r:0,k:0},cards:[],res:[],nobles:[],pts:0,bought:0}));
  log(`Game start — first to ${G.opts.target} points. ${pn(P())} begins.`);
  lastCur=-1;winClosed=false;inLobby=false;$('lobby').style.display='none';sel=[];pick=null;render();
}
const P=()=>G.players[G.cur];
const pn=p=>`<b style="color:${p.color}">${esc(p.name)}</b>`;
const log=m=>{G.log.push(m);if(G.log.length>200)G.log.shift()};
const tot=o=>ALL.reduce((s,g)=>s+(o[g]||0),0);
const fx=(from,to,kind,gem,n=1)=>{if(!n)return;G.fx.push({id:++G.fxSeq,from,to,kind,gem,n});if(G.fx.length>40)G.fx.shift()};
// cost after bonuses; null when the player can't cover it even with gold
function payFor(p,card){
  const pay={};let gold=0;
  for(const g of GEMS){
    const need=Math.max(0,(card.cost[g]||0)-p.bonus[g]),use=Math.min(need,p.tok[g]);
    pay[g]=use;gold+=need-use;
  }
  return gold>p.tok.y?null:{pay,gold};
}
const qualifies=(p,n)=>GEMS.every(g=>p.bonus[g]>=(n[g]||0));
const cardAt=(where,tier,idx)=>where==='board'?G.board[tier][idx]:P().res[idx];

// ---------- actions ----------
function takeTokens(list){
  if(G.prompt||G.winner!==null||!Array.isArray(list)||!list.length||list.length>3)return;
  const cnt={};list.forEach(g=>cnt[g]=(cnt[g]||0)+1);
  const keys=Object.keys(cnt);
  if(keys.some(g=>!GEMS.includes(g)))return;
  if(keys.length===1&&cnt[keys[0]]===2){if(G.bank[keys[0]]<4)return}          // two of a kind needs a stack of 4+
  else if(keys.length!==list.length||list.some(g=>!G.bank[g]))return;          // otherwise up to 3 distinct
  const p=P();
  list.forEach(g=>{G.bank[g]--;p.tok[g]++;fx('bank',G.cur,'tok',g)});
  log(`${pn(p)} took ${list.map(g=>chip(g)).join('')}`);
  finishTurn();
}
function buy(where,tier,idx){
  if(G.prompt||G.winner!==null)return;
  const p=P(),card=cardAt(where,tier,idx);if(!card)return;
  const c=payFor(p,card);if(!c)return;
  GEMS.forEach(g=>{if(c.pay[g]){p.tok[g]-=c.pay[g];G.bank[g]+=c.pay[g];fx(G.cur,'bank','tok',g,c.pay[g])}});
  if(c.gold){p.tok.y-=c.gold;G.bank.y+=c.gold;fx(G.cur,'bank','tok','y',c.gold)}
  p.cards.push(card);p.bonus[card.gem]++;p.pts+=card.pts;p.bought++;
  if(where==='board'){fx({slot:[tier,idx]},G.cur,'card',card.gem);G.board[tier][idx]=G.decks[tier].pop()||null}
  else{fx(G.cur,G.cur,'card',card.gem);p.res.splice(idx,1)}
  log(`${pn(p)} bought a ${GN[card.gem]} card${card.pts?` (+${card.pts} pts)`:''}.`);
  finishTurn();
}
function reserve(where,tier,idx){
  if(G.prompt||G.winner!==null)return;
  const p=P();if(p.res.length>=3)return;
  let card;
  if(where==='board'){card=G.board[tier][idx];if(!card)return;fx({slot:[tier,idx]},G.cur,'card',card.gem);G.board[tier][idx]=G.decks[tier].pop()||null}
  else{card=G.decks[tier].pop();if(!card)return;card={...card,hidden:true};fx({deck:tier},G.cur,'card','y')}
  p.res.push(card);
  let g='';
  if(G.bank.y>0){G.bank.y--;p.tok.y++;g=' and took '+chip('y');fx('bank',G.cur,'tok','y')}
  log(`${pn(p)} reserved a tier ${tier+1} card${where==='deck'?' from the deck':''}${g}.`);
  finishTurn();
}
function returnTokens(selObj){
  if(!G.prompt||G.prompt.t!=='return')return;
  const p=P(),need=tot(p.tok)-10,sum=ALL.reduce((s,g)=>s+(selObj[g]|0),0);
  if(sum!==need||!ALL.every(g=>(selObj[g]|0)>=0&&(selObj[g]|0)<=p.tok[g]))return;
  ALL.forEach(g=>{const n=selObj[g]|0;if(n){p.tok[g]-=n;G.bank[g]+=n;fx(G.cur,'bank','tok',g,n)}});
  log(`${pn(p)} returned ${need} token(s).`);
  G.prompt=null;finishTurn();
}
function claimNoble(i){
  const n=G.nobles[i];if(!n)return;
  const p=P();p.nobles.push(n);p.pts+=3;G.nobles.splice(i,1);
  fx('nobles',G.cur,'noble','y');log(`👑 ${pn(p)} is visited by a noble (+3 pts).`);
}
function chooseNoble(i){
  if(!G.prompt||G.prompt.t!=='noble'||!G.prompt.opts.includes(i))return;
  G.prompt=null;claimNoble(i);nextTurn();
}
function finishTurn(){
  const p=P();
  if(tot(p.tok)>10){G.prompt={t:'return'};return render()}
  const elig=G.nobles.map((n,i)=>i).filter(i=>qualifies(p,G.nobles[i]));
  if(elig.length>1){G.prompt={t:'noble',opts:elig};return render()}
  if(elig.length===1)claimNoble(elig[0]);
  nextTurn();
}
function nextTurn(){
  G.prompt=null;G.turns++;
  if(P().pts>=G.opts.target)G.ending=true;                 // finish the round so everyone has equal turns
  G.cur=(G.cur+1)%G.players.length;
  if(G.cur===0){
    G.round++;
    if(G.ending){
      const best=Math.max(...G.players.map(x=>x.pts));
      const win=G.players.filter(x=>x.pts===best).sort((a,b)=>a.bought-b.bought)[0];
      G.winner=win.i;G.end=Date.now();log(`🏆 ${pn(win)} wins with ${win.pts} points!`);
      return render();
    }
  }
  log(`${pn(P())}'s turn.`);render();
}

// ---------- net (host-authoritative, same shape as the Catan build) ----------
let me=null,online=false,isHost=false,peer=null,hostConn=null,conns={},roomCode='',myName='',lobbySeats=[],netStatus='',inLobby=true;
const isMe=i=>me===null||me===i;
const myTurn=()=>!!G&&isMe(G.cur)&&G.winner===null;
function act(fn,...args){
  if(online&&!isHost){if(hostConn&&hostConn.open)hostConn.send({t:'act',fn,args});return}
  if(!online||allowed(me,fn,args))window[fn](...args);
}
function allowed(s,fn,args){
  if(!G||G.winner!==null||s===undefined||s!==G.cur)return false;
  return ['takeTokens','buy','reserve','returnTokens','chooseNoble'].includes(fn);
}
const seatOn=x=>x.on!==undefined?x.on:!!x.conn;
function broadcast(m){lobbySeats.forEach(x=>{if(x.conn&&x.conn!=='host'&&x.conn.open)x.conn.send(m)})}
const broadcastLobby=()=>broadcast({t:'lobby',seats:lobbySeats.map(x=>({name:x.name,color:x.color,on:seatOn(x)}))});
function hostRoom(){
  myName=$('myName').value.trim()||'Host';
  roomCode=[...Array(5)].map(()=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random()*32)]).join('');
  setStatus('Creating room…');if(peer)peer.destroy();
  peer=new Peer('splendor-'+roomCode);
  peer.on('open',()=>{online=true;isHost=true;me=0;lobbySeats=[{name:myName,color:PCOL[0],conn:'host'}];setStatus('Room ready — share the code.')});
  peer.on('connection',c=>{c.on('data',d=>onHostData(c,d));c.on('close',()=>onLeave(c))});
  peer.on('error',e=>{if(e.type==='unavailable-id')hostRoom();else setStatus('Error: '+e.type)});
}
function joinRoom(){
  myName=$('myName').value.trim()||'Guest';const code=$('joinCode').value.trim().toUpperCase();
  if(code.length<3){setStatus('Enter the room code.');return}
  setStatus('Connecting…');if(peer)peer.destroy();
  peer=new Peer();
  peer.on('open',()=>{

  newGame(['Ana','Ben','Cleo'].map((n,i)=>({name:n,color:PCOL[i]})));
  for(let t=0;t<26&&G.winner===null;t++){
    const p=P();
    let bought=false;
    for(let tier=2;tier>=0&&!bought;tier--)for(let i=0;i<4;i++){const c=G.board[tier][i];if(c&&payFor(p,c)){buy('board',tier,i);bought=true;break}}
    if(bought)continue;
    const avail=GEMS.filter(g=>G.bank[g]);
    if(avail.length>=3)takeTokens(avail.slice(0,3));
    else if(avail.length)takeTokens([avail[0]]);
    else reserve('board',0,0);
    while(G.prompt&&G.prompt.t==='return'){const q=P();const s={};let need=tot(q.tok)-10;for(const g of ALL){while(need>0&&(s[g]|0)<q.tok[g]){s[g]=(s[g]|0)+1;need--}}returnTokens(s)}
    while(G.prompt&&G.prompt.t==='noble')chooseNoble(G.prompt.opts[0]);
  }
  render();
}
location.hash==='#test'?selfTest():location.hash==='#demo'?demo():renderLobby();
</script>
